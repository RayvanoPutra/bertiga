<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Uji Coba - Bank Mini</title>
    <!-- 1. Memuat Tailwind CSS untuk styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Font dasar yang bersih */
        body { font-family: 'Inter', sans-serif; }
        /* Style tambahan untuk tombol yang dinonaktifkan */
        button:disabled { background-color: #9ca3af; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 p-8">

    <div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-lg">

        <!-- BAGIAN 1: LOGIN PETUGAS -->
        <div class="mb-6 border-b pb-6">
            <h1 class="text-2xl font-bold text-gray-800 mb-4">Langkah 1: Login Petugas</h1>
            <div class="grid grid-cols-2 gap-4">
                <input type="text" id="username" value="superadmin" class="border p-2 rounded-md">
                <input type="password" id="password" value="password" class="border p-2 rounded-md">
            </div>
            <button id="loginButton" class="mt-4 w-full bg-blue-600 text-white p-3 rounded-md font-semibold hover:bg-blue-700">
                1. Login & Dapatkan Token
            </button>
            <textarea id="tokenArea" class="w-full text-xs text-gray-500 mt-2 p-2 border rounded-md" rows="2" placeholder="Token akan muncul di sini..." readonly></textarea>
        </div>

        <!-- BAGIAN 2: DAFTAR TRANSAKSI PENDING -->
        <div class="mb-6">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Langkah 2: Ambil Transaksi Pending</h2>
            <button id="getPendingButton" class="w-full bg-gray-600 text-white p-3 rounded-md font-semibold hover:bg-gray-700" disabled>
                2. Ambil Data Pending
            </button>
            
            <!-- Daftar transaksi akan muncul di sini -->
            <div id="pendingList" class="mt-4 space-y-3">
                <!-- Contoh item:
                <div class="border p-3 rounded-md flex justify-between items-center">
                    <div>
                        <span class="font-bold">ID: 1 - Rian</span>
                        <span class="block text-sm text-gray-600">Jumlah: Rp 10.000</span>
                    </div>
                    <button class="bg-green-500 text-white px-4 py-2 rounded-md">Approve</button>
                </div> 
                -->
            </div>
        </div>

        <!-- BAGIAN 3: LOG HASIL -->
        <div>
            <h3 class="text-lg font-semibold text-gray-700">Log Hasil</h3>
            <div id="logArea" class="h-32 bg-gray-800 text-green-400 text-sm p-3 rounded-md overflow-y-auto font-mono">
                Menunggu aksi...
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // --- KONFIGURASI PENTING ---
        // Ganti IP address ini sesuai dengan server Laravel Anda
        const BASE_URL_API = "http://192.168.129.2:8000/api";
        // --------------------------

        // Variabel global untuk menyimpan token
        let authToken = null;

        // Referensi Elemen UI
        const loginButton = document.getElementById('loginButton');
        const getPendingButton = document.getElementById('getPendingButton');
        const tokenArea = document.getElementById('tokenArea');
        const pendingList = document.getElementById('pendingList');
        const logArea = document.getElementById('logArea');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');

        // Fungsi untuk mencatat log
        function log(message, isError = false) {
            console.log(message);
            logArea.innerHTML = `<span class="${isError ? 'text-red-400' : 'text-green-400'}">${new Date().toLocaleTimeString()}: ${message}</span><br>` + logArea.innerHTML;
        }

        // --- FUNGSI LANGKAH 1: LOGIN ---
        loginButton.addEventListener('click', async () => {
            log('Mencoba login sebagai petugas...');
            const username = usernameInput.value;
            const password = passwordInput.value;

            try {
                const response = await fetch(`${BASE_URL_API}/login/petugas`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Login Gagal');
                }

                authToken = data.access_token; // Simpan token
                tokenArea.value = `Bearer ${authToken}`;
                getPendingButton.disabled = false; // Aktifkan tombol Langkah 2
                loginButton.disabled = true; // Nonaktifkan tombol login
                log('Login Petugas Berhasil! Token didapat.');

            } catch (error) {
                log(`Login Gagal: ${error.message}`, true);
            }
        });

        // --- FUNGSI LANGKAH 2: AMBIL DATA PENDING ---
        getPendingButton.addEventListener('click', getPendingTransactions);

        async function getPendingTransactions() {
            if (!authToken) {
                log('Token tidak ditemukan. Harap login dulu.', true);
                return;
            }

            log('Mengambil daftar transaksi pending...');
            pendingList.innerHTML = '<p class="text-center">Loading...</p>';

            try {
                const response = await fetch(`${BASE_URL_API}/transaksi/pending`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Accept': 'application/json'
                    }
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Gagal mengambil data pending');
                }
                
                log(`Berhasil mengambil ${data.length} data pending.`);
                displayPendingList(data);

            } catch (error) {
                log(`Gagal: ${error.message}`, true);
            }
        }
        
        // Fungsi untuk menampilkan daftar transaksi
        function displayPendingList(transactions) {
            pendingList.innerHTML = ''; // Kosongkan daftar
            if (transactions.length === 0) {
                pendingList.innerHTML = '<p class="text-center text-gray-500">Tidak ada transaksi pending.</p>';
                return;
            }

            transactions.forEach(tx => {
                // Format mata uang (sederhana)
                const jumlahFormatted = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR' }).format(tx.jumlah);

                const item = document.createElement('div');
                item.className = 'border p-3 rounded-md flex justify-between items-center shadow-sm';
                item.innerHTML = `
                    <div>
                        <span class="font-bold">ID: ${tx.id} - ${tx.nama_saat_transaksi}</span>
                        <span class="block text-sm text-gray-600">Jumlah: ${jumlahFormatted}</span>
                        <span class="block text-xs text-gray-500">No. Rek: ${tx.no_rekening}</span>
                    </div>
                    <button class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700" onclick="approveTransaction(${tx.id})">
                        Approve
                    </button>
                `;
                pendingList.appendChild(item);
            });
        }

        // --- FUNGSI LANGKAH 3: APPROVE TRANSAKSI ---
        async function approveTransaction(transactionId) {
            if (!authToken) {
                log('Token tidak ditemukan. Harap login dulu.', true);
                return;
            }
            
            log(`Mencoba approve transaksi ID: ${transactionId}...`);

            try {
                const response = await fetch(`${BASE_URL_API}/transaksi/approve/${transactionId}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Accept': 'application/json'
                    }
                });

                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.message || `Gagal approve ID: ${transactionId}`);
                }
                
                log(`SUKSES! Transaksi ID: ${transactionId} telah disetujui.`);
                // Refresh daftar pending setelah berhasil
                getPendingTransactions();

            } catch (error) {
                log(`Gagal: ${error.message}`, true);
            }
        }
    </script>
</body>
</html>
